services:
  - type: web
    name: gastoclaro-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GASTOCLARO_SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gastoclaro-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://tu-app.vercel.app
      - key: SENTRY_DSN
        sync: false

databases:
  - name: gastoclaro-db
    plan: free
